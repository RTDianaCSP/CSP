<!doctype html>
<html>
  <head>
    <title>Aplicación de Menús Semanales</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f6f8;
      }

      nav {
        background-color: #2c3e50;
        padding: 15px;
        display: flex;
        gap: 20px;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 8px 14px;
        border-radius: 6px;
        transition: background 0.3s;
      }

      nav a:hover {
        background-color: #34495e;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-top: 0;
        color: #2c3e50;
      }

      .btn {
        display: inline-block;
        background-color: #2c3e50;
        color: white;
        padding: 10px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.3s;
      }

      .btn:hover {
        background-color: #34495e;
      }

      .btn-edit {
        display: inline-block;
        background-color: #f39c12;
        color: white;
        padding: 4px 8px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        font-size: 12px;
        transition: background 0.3s;
      }

      .btn-edit:hover {
        background-color: #e67e22;
      }

      .btn-delete {
        display: inline-block;
        background-color: #e74c3c;
        color: white;
        padding: 4px 8px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        font-size: 12px;
        transition: background 0.3s;
      }

      .btn-delete:hover {
        background-color: #c0392b;
      }
    </style>
  </head>

  <body>
    <nav>
      <a href="/ingredientes/">Ingredientes</a>
      <a href="/platos/">Platos</a>
      <a href="/menus/">Menús Semanales</a>
    </nav>

    <div class="container">
      {% block content %}
      <h1>Bienvenid@!</h1>
      <p>Selecciona una opción del menú para empezar</p>

      {% endblock %}
    </div>
  </body>
</html>
